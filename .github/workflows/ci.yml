name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Libraries Qt needs (offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install ruff PySide6 requests cryptography secretstorage
      - name: Lint
        run: ruff check cellar tests tools
      - name: Compile
        run: python -m compileall -q cellar
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
        env:
          QT_QPA_PLATFORM: offscreen

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the Nix package
        run: nix build -L
      - name: It starts
        run: ./result/bin/cellar --version
