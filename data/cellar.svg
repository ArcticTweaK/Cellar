<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Cellar: a vault of arches going down into the cellar, a lit doorway at the end.
       The layers are the accounts; colours match the default Blossom theme (accent #f0679a). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2532"/>
      <stop offset="1" stop-color="#131116"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc2d8"/>
      <stop offset="1" stop-color="#f0679a"/>
    </linearGradient>
    <!-- the glow is the fill of the rounded square itself, so it never spills past the edge -->
    <radialGradient id="halo" cx="128" cy="200" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0679a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f0679a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#halo)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#fff" stroke-opacity="0.09"/>
  <path d="M48 204 V128 A80 80 0 0 1 208 128 V204" fill="none" stroke="#6e3653" stroke-width="22"/>
  <path d="M82 204 V148 A46 46 0 0 1 174 148 V204" fill="none" stroke="#b84e7f" stroke-width="22"/>
  <path d="M106 204 V166 A22 22 0 0 1 150 166 V204 Z" fill="url(#door)"/>
  <rect x="44" y="204" width="168" height="5" rx="2.5" fill="#f0679a" fill-opacity="0.55"/>
</svg>
